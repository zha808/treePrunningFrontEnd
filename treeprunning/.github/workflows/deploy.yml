name: Deploy Frontend
 
on:
  push:
    branches: [main]
 
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: treeprunning/package-lock.json
 
      - name: Install dependencies
        working-directory: treeprunning
        run: npm ci
 
      - name: Build
        working-directory: treeprunning
        run: npm run build
        env:
          VITE_API_BASE_URL: https://api.treepruning.org
          VITE_KEYCLOAK_URL: https://auth.treepruning.org
          VITE_KEYCLOAK_REALM: treepruning
          VITE_KEYCLOAK_CLIENT_ID: treepruning-frontend
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
 
      - name: Copy build to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "treeprunning/dist/*"
          target: "/home/treepruning/tree-pruning/frontend-dist"
          strip_components: 2
 
      - name: Restart Frontend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: docker restart tp-frontend